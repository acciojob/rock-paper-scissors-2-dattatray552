
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Rock Paper Scissors</h1>

    <!-- Number of turns -->
    <label for="game-number">Number of Turns:</label>

    <input
        type="number"
        id="game-number"
        data-ns-test="game-number"
        min="1"
        placeholder="Enter turns"
    >

    <button
        id="play-game"
        data-ns-test="play-game"
        type="button">
        Play
    </button>

    <hr>

    <!-- Game information -->
    <p>
        Rounds Left:
        <span data-ns-test="rounds-left">0</span>
    </p>

    <p>
        User Points:
        <span data-ns-test="user-points">0</span>
    </p>

    <p>
        Computer Points:
        <span data-ns-test="computer-points">0</span>
    </p>

    <!-- Choices -->
    <h2>Choose:</h2>

    <button
        data-ns-test="rock"
        type="button">
        ROCK
    </button>

    <button
        data-ns-test="paper"
        type="button">
        PAPER
    </button>

    <button
        data-ns-test="scissors"
        type="button">
        SCISSORS
    </button>

    <!-- Computer choice -->
    <p>
        Computer Choose:
        <span data-ns-test="computer-choose">-</span>
    </p>

    <!-- Round result -->
    <p>
        Round Result:
        <span data-ns-test="round-result">-</span>
    </p>

    <!-- Final game result -->
    <h2>
        Game Result:
        <span data-ns-test="game-result">-</span>
    </h2>

    <script src="script.js"></script>

</body>
</html>
